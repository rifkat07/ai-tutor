version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1-pg16
    container_name: ai_tutor_postgres
    environment:
      POSTGRES_USER: tutor_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: ai_tutor_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: ai_tutor_redis
    ports:
      - "6379:6379"

  backend:
    build: ./apps/backend
    container_name: ai_tutor_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://tutor_admin:super_secret_password@postgres:5432/ai_tutor_db
      - REDIS_URL=redis://redis:6379/0
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./apps/frontend
    container_name: ai_tutor_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata: